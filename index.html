<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QEVIRA</title>

  <meta name="theme-color" content="#111111">
  <meta name="description" content="QEVIRA - Connect and chat">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <style>
    /* REAL AUTH SCREEN */
    #authScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .auth-logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .auth-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 7px 0;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1d1d1d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .auth-box input:focus {
      border-color: #777;
    }

    .auth-btn {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-btn:disabled {
      opacity: 0.6;
    }

    .auth-switch {
      margin-top: 22px;
      color: #aaa;
      font-size: 14px;
    }

    .auth-switch button {
      border: 0;
      background: none;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    #authMessage {
      min-height: 22px;
      margin-top: 15px;
      font-size: 14px;
      color: #ccc;
    }

    #app {
      display: none;
    }

    .user-email {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
      word-break: break-word;
    }

    .logout-button {
      margin-top: 20px;
      padding: 12px 18px;
      border: 1px solid #444;
      border-radius: 10px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- =========================
       REAL SUPABASE AUTH
  ========================== -->

  <section id="authScreen">

    <div class="auth-box">

      <div class="auth-logo">QEVIRA</div>

      <div class="auth-subtitle" id="authSubtitle">
        Create your account
      </div>

      <!-- SIGN UP -->
      <form id="signupForm">

        <input
          id="signupEmail"
          type="email"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button class="auth-btn" type="submit" id="signupBtn">
          Create account
        </button>

      </form>

      <!-- LOGIN -->
      <form id="loginForm" style="display:none;">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button class="auth-btn" type="submit" id="loginBtn">
          Log in
        </button>

      </form>

      <div id="authMessage"></div>

      <div class="auth-switch">

        <span id="switchText">
          Already have an account?
        </span>

        <button type="button" id="switchAuthBtn">
          Log in
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       QEVIRA APP
  ========================== -->

  <main id="app">

    <header class="topbar">

      <div class="brand">
        QEVIRA
      </div>

      <button id="darkModeBtn" class="icon-btn" type="button">
        🌙
      </button>

    </header>


    <!-- CHATS -->

    <section id="chatsPage" class="page">

      <div class="page-header">

        <div>
          <h2>Chats</h2>
          <div id="currentUserEmail" class="user-email"></div>
        </div>

        <button id="newChatBtn" type="button">
          +
        </button>

      </div>

      <div class="search-container">

        <input
          id="searchInput"
          type="search"
          placeholder="Search chats..."
        >

      </div>

      <div id="chatList"></div>

    </section>


    <!-- CONTACTS -->

    <section id="contactsPage" class="page" style="display:none;">

      <div class="page-header">
        <h2>Contacts</h2>
      </div>

      <div id="contactsList"></div>

    </section>


    <!-- PROFILE -->

    <section id="profilePage" class="page" style="display:none;">

      <div class="page-header">
        <h2>Profile</h2>
      </div>

      <div class="profile-card">

        <div class="profile-avatar">
          Z
        </div>

        <h2 id="profileName">
          Zarif
        </h2>

        <p id="profileUsername">
          @zarif
        </p>

        <div id="profileEmail" class="user-email"></div>

        <button
          id="logoutBtn"
          class="logout-button"
          type="button"
        >
          Log out
        </button>

      </div>

    </section>


    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

      <button
        class="nav-btn active"
        data-page="chatsPage"
        type="button"
      >
        💬
        <span>Chats</span>
      </button>

      <button
        class="nav-btn"
        data-page="contactsPage"
        type="button"
      >
        👥
        <span>Contacts</span>
      </button>

      <button
        class="nav-btn"
        data-page="profilePage"
        type="button"
      >
        👤
        <span>Profile</span>
      </button>

    </nav>

  </main>


  <!-- CHAT MODAL -->

  <div id="chatModal" class="modal" style="display:none;">

    <div class="modal-content">

      <button id="closeChatModal" type="button">
        ✕
      </button>

      <h2 id="chatTitle">
        Chat
      </h2>

      <div id="messages"></div>

      <form id="messageForm">

        <input
          id="messageInput"
          type="text"
          placeholder="Message..."
          autocomplete="off"
        >

        <button type="submit">
          Send
        </button>

      </form>

    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- QEVIRA APP -->
  <script src="app.js"></script>

</body>
  </html>
