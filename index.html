<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>QEVIRA</title>  <meta name="theme-color" content="#6C5CE7">
  <meta name="description" content="QEVIRA - Connect and chat">  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head><body>  <!-- ==================================================
       AUTH SCREEN
  ================================================== -->  <section id="authScreen"><div class="auth-box">

  <div class="auth-logo">QEVIRA</div>

  <div class="auth-subtitle" id="authSubtitle">
    Create your account
  </div>

  <!-- SIGN UP -->

  <form id="signupForm">

    <input
      id="signupEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
      required
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
      minlength="6"
      required
    >

    <button
      class="auth-btn"
      type="submit"
      id="signupBtn"
    >
      Create account
    </button>

  </form>


  <!-- LOGIN -->

  <form
    id="loginForm"
    style="display:none;"
  >

    <input
      id="loginEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
      required
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button
      class="auth-btn"
      type="submit"
      id="loginBtn"
    >
      Log in
    </button>

  </form>


  <div id="authMessage"></div>


  <div class="auth-switch">

    <span id="switchText">
      Already have an account?
    </span>

    <button
      type="button"
      id="switchAuthBtn"
    >
      Log in
    </button>

  </div>

</div>

  </section>  <!-- ==================================================
       QEVIRA APP
  ================================================== -->  <main id="app"><!-- TOP BAR -->

<header class="topbar">

  <div class="brand">
    <span class="brand-dot"></span>
    QEVIRA
  </div>

  <button
    id="darkModeBtn"
    class="icon-btn"
    type="button"
    aria-label="Toggle theme"
  >
    🌙
  </button>

</header>


<!-- ==================================================
     CHATS PAGE
================================================== -->

<section
  id="chatsPage"
  class="page"
>

  <div class="page-header">

    <div>

      <p class="page-label">
        MESSAGES
      </p>

      <h2>
        Chats
      </h2>

      <div
        id="currentUserEmail"
        class="user-email"
      ></div>

    </div>

    <button
      id="newChatBtn"
      class="new-chat-btn"
      type="button"
    >
      +
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-container">

    <span class="search-icon">
      🔎
    </span>

    <input
      id="searchInput"
      type="search"
      placeholder="Search chats..."
    >

  </div>


  <!-- CHAT LIST -->

  <div id="chatList">
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <h3>No chats yet</h3>
      <p>Start a conversation with someone from Contacts.</p>
    </div>
  </div>

</section>


<!-- ==================================================
     CONTACTS PAGE
================================================== -->

<section
  id="contactsPage"
  class="page"
  style="display:none;"
>

  <div class="page-header">

    <div>

      <p class="page-label">
        PEOPLE
      </p>

      <h2>
        Contacts
      </h2>

    </div>

  </div>

  <div id="contactsList">

    <div class="empty-state">
      <div class="empty-icon">👥</div>
      <h3>Loading contacts...</h3>
    </div>

  </div>

</section>


<!-- ==================================================
     PROFILE PAGE
================================================== -->

<section
  id="profilePage"
  class="page"
  style="display:none;"
>

  <div class="page-header">

    <div>

      <p class="page-label">
        ACCOUNT
      </p>

      <h2>
        Profile
      </h2>

    </div>

  </div>


  <div class="profile-card">

    <div
      class="profile-avatar"
      id="profileAvatar"
    >
      Q
    </div>

    <h2 id="profileName">
      QEVIRA User
    </h2>

    <p id="profileUsername">
      @user
    </p>

    <div
      id="profileEmail"
      class="user-email"
    ></div>


    <div class="profile-divider"></div>


    <button
      id="logoutBtn"
      class="logout-button"
      type="button"
    >
      Log out
    </button>

  </div>

</section>


<!-- ==================================================
     BOTTOM NAVIGATION
================================================== -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    data-page="chatsPage"
    type="button"
  >
    <span class="nav-icon">💬</span>
    <span>Chats</span>
  </button>


  <button
    class="nav-btn"
    data-page="contactsPage"
    type="button"
  >
    <span class="nav-icon">👥</span>
    <span>Contacts</span>
  </button>


  <button
    class="nav-btn"
    data-page="profilePage"
    type="button"
  >
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </button>

</nav>

  </main>  <!-- ==================================================
       CHAT MODAL
  ================================================== -->  <div
    id="chatModal"
    class="modal"
    style="display:none;"
  ><div class="modal-content">

  <div class="chat-header">

    <button
      id="closeChatModal"
      class="icon-btn"
      type="button"
    >
      ←
    </button>

    <div>

      <p class="chat-header-label">
        CONVERSATION
      </p>

      <h2 id="chatTitle">
        Chat
      </h2>

    </div>

  </div>


  <div id="messages">

    <div class="empty-state">
      <div class="empty-icon">👋</div>
      <h3>Say hello!</h3>
    </div>

  </div>


  <form id="messageForm">

    <div class="message-input-container">

      <input
        id="messageInput"
        type="text"
        placeholder="Write a message..."
        autocomplete="off"
      >

      <button
        type="submit"
        class="send-button"
      >
        ➤
      </button>

    </div>

  </form>

</div>

  </div>  <!-- ==================================================
       SUPABASE
  ================================================== -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <!-- QEVIRA APP -->  <script src="app.js"></script>  <!-- ==================================================
       QEVIRA NAVIGATION
  ================================================== -->  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const navButtons =
        document.querySelectorAll(".nav-btn");

      const pages =
        document.querySelectorAll(".page");

      navButtons.forEach(button => {

        button.addEventListener("click", () => {

          const pageId =
            button.dataset.page;

          pages.forEach(page => {
            page.style.display = "none";
          });

          const selectedPage =
            document.getElementById(pageId);

          if (selectedPage) {
            selectedPage.style.display = "block";
          }

          navButtons.forEach(btn => {
            btn.classList.remove("active");
          });

          button.classList.add("active");

        });

      });


      /* DARK MODE */

      const darkModeBtn =
        document.getElementById("darkModeBtn");

      if (darkModeBtn) {

        darkModeBtn.addEventListener("click", () => {

          document.body.classList.toggle("dark-mode");

          const dark =
            document.body.classList.contains("dark-mode");

          darkModeBtn.textContent =
            dark ? "☀️" : "🌙";

        });

      }

    });

  </script></body>
    </html>
